# Nginx config for the notifier webhook service.
#
# Assumes:
# - Domain is behind Cloudflare (orange cloud ON)
# - Cloudflare Origin CA certificate installed at the paths below
# - notifier FastAPI app listens on 127.0.0.1:8000
#
# Generate Cloudflare Origin CA cert:
#   1. Cloudflare dashboard → SSL/TLS → Origin Server → Create Certificate
#   2. Save cert to /etc/ssl/certs/cloudflare-origin.pem
#   3. Save private key to /etc/ssl/private/cloudflare-origin.key
#   4. Cert is valid 15 years — no renewal needed
#
# Authenticated Origin Pull (recommended):
#   Download https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
#   to /etc/ssl/certs/cloudflare-auth-pull.pem
#   Then add ssl_verify_client on; (commented below).

server {
    listen 80;
    server_name pb.kotakpasir.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pb.kotakpasir.my.id;

    ssl_certificate     /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Uncomment to require Cloudflare Authenticated Origin Pull.
    # Ensures only Cloudflare can reach this origin.
    # ssl_client_certificate /etc/ssl/certs/cloudflare-auth-pull.pem;
    # ssl_verify_client on;

    # Restrict to Cloudflare IP ranges (alternative to Authenticated Origin Pull).
    # See https://www.cloudflare.com/ips/ for current list.
    # allow 173.245.48.0/20;
    # allow 103.21.244.0/22;
    # ... (full list in README)
    # deny all;

    location /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    location /webhook/form {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_request_buffering off;
    }
}
